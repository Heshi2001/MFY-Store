<div
  x-show="filterOpen"
  x-cloak
  x-transition.opacity
  class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-end sm:items-center justify-center"
>
  <div
    @click.away="closeFilter()"
    class="w-full sm:max-w-lg bg-gray-900 border border-gray-700 rounded-t-2xl sm:rounded-2xl p-6"
  >
    <div class="flex justify-between items-center mb-5">
      <h2 class="text-lg font-semibold text-[#00C897]">
        <i class="fa-solid fa-sliders mr-2"></i>Filters
      </h2>
      <button @click="closeFilter()" class="text-gray-400 hover:text-white text-xl">✕</button>
    </div>

    <!-- ✅ PRICE -->
    <div class="mb-5">
      <p class="text-sm text-gray-400 mb-2 font-medium">Price Range (₹)</p>
      <div class="flex gap-3">
        <input id="min-price" type="number" placeholder="Min ₹"
          class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#00C897] focus:border-transparent">
        <input id="max-price" type="number" placeholder="Max ₹"
          class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#00C897] focus:border-transparent">
      </div>
    </div>

    <!-- ✅ BRANDS -->
    {% if brands %}
    <div class="mb-5">
      <p class="text-sm text-gray-400 mb-2 font-medium">Brand</p>
      <div class="space-y-2 max-h-44 overflow-y-auto pr-1 scrollbar-hide">
        {% for brand in brands %}
        <label class="flex items-center gap-3 text-sm cursor-pointer hover:text-[#00C897] transition group">
          <input type="checkbox"
                 class="brand-checkbox accent-[#00C897] w-4 h-4"
                 value="{{ brand.id }}">
          <span class="text-gray-300 group-hover:text-[#00C897]">{{ brand.name }}</span>
        </label>
        {% endfor %}
      </div>
    </div>
    {% endif %}

    <!-- ✅ ACTIONS -->
    <div class="flex gap-3 pt-2">
      <button
        id="apply-filter"
        type="button"
        @click="closeFilter()"
        class="flex-1 bg-[#00C897] text-black py-2.5 rounded-lg font-semibold hover:opacity-90 transition text-sm">
        Apply Filters
      </button>
      <button
        id="clear-filter"
        type="button"
        class="flex-1 border border-gray-600 py-2.5 rounded-lg hover:bg-gray-800 transition text-sm text-gray-300">
        Clear All
      </button>
    </div>

  </div>
</div>
